name: Unit tests

on:
  workflow_call:
    inputs:
      # Still using JSON-encoded arrays for matrix values
      perl_version:
        required: false
        type: string
        default: '["5.24", "5.26", "5.28", "5.30", "5.32", "5.34", "5.36", "5.38", "5.40", "5.42"]'
      os:
        required: false
        type: string
        default: '["windows-latest", "macos-latest", "ubuntu-latest"]'
      testing_context:
        required: false
        type: string
        default: '[ ]'
      listdeps_args:
        required: false
        type: string
        default: '--author'
      # list of modules to install as a list of module in a single line separated by white spaces
      deplist:
        required: false
        type: string

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }}
        perl: ${{ fromJson(inputs.perl_version) }}

    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Perl version
        run: perl -V
      - name: Install Dist::Zilla
        run: cpanm --notest Dist::Zilla
      - name: Install Dist::Zilla plugins
        run: dzil authordeps | cpanm --notest
      - name: Install modules
        run: |
          dep_list="${{ inputs.deplist }}"
          if [[ -n $dep_list ]]
          then
            echo $dep_list | cpanm --notest
          fi
          dzil listdeps ${{ inputs.listdeps_args }} | cpanm --notest
      - name: Run tests
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          dzil test
      - name: Archive CPAN logs on Windows
        if: ${{ failure() && matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: cpan_log
          path: C:\Users\RUNNER~1\.cpanm\work\*\build.log
          retention-days: 5
      - name: Archive CPAN logs on Unix
        if: ${{ failure() && matrix.os != 'windows-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: cpan_log
          path: /home/runner/.cpanm/work/*/build.log
          retention-days: 5
